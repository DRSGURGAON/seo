# Actions tab > "Sync posts from Google Sheet" > Run workflow.
# Reads the sheet (GBP_SHEET_ID as a repository variable or secret), rebuilds businesses/*.json and out/*/posts.json,
# and commits them only if every post passes `checkPosts`. The website widget reads out/<id>/posts.json
# from main, so the site updates by itself a few minutes later.
name: Sync posts from Google Sheet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only main feeds the website widget — a run started on another branch would commit there by mistake.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # newest main, not the commit from when the run was queued
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync from the sheet (stops here if any post fails the checks)
        env:
          GBP_SHEET_ID: ${{ vars.GBP_SHEET_ID || secrets.GBP_SHEET_ID }}
        run: npm run sync
      - name: Commit changes
        run: |
          git add businesses out
          if git diff --cached --quiet; then
            echo "Sheet and repo already match, nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync posts from Google Sheet"
          # Another Action may have pushed to main meanwhile: rebase on it (our changes win) and retry.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "::error::Could not push to main after 3 tries. Run this Action again."
          exit 1
