# Actions tab > "Generate AI photos" > Run workflow. Needs GBP_SHEET_ID (and the GEMINI_API_KEY secret for source = gemini).
# Makes a photo (own photo from the Photos tab, or Gemini) for each upcoming post without one; offers get a banner; commits the photos to photos/ on main (so the
# sheet can preview them) and out/<id>/photo-review.csv. Import that CSV into the AI_Photos tab (Append),
# approve or reject each photo, then run "Sync posts from Google Sheet".
name: Generate AI photos

on:
  workflow_dispatch:
    inputs:
      business:
        description: Business id
        default: amex
        required: true
      only:
        description: Which posts (offer / post / all)
        default: offer
        required: true
        type: choice
        options: [offer, post, all]
      source:
        description: Photo source (pool = your own photos from the Photos tab, gemini = AI, needs Gemini billing)
        default: pool
        required: true
        type: choice
        options: [pool, gemini]
      limit:
        description: Max photos this run
        default: '10'
        required: true

permissions:
  contents: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  photos:
    # Photo links in the review CSV point at main, so only main may run this.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # newest main, not the commit from when the run was queued
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make photos (own photos or Gemini; offers get a banner)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable to switch the image model without a code change.
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GBP_SHEET_ID: ${{ vars.GBP_SHEET_ID || secrets.GBP_SHEET_ID }}
          BUSINESS: ${{ inputs.business }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          SOURCE: ${{ inputs.source }}
        run: npm run photos -- "$BUSINESS" --only "$ONLY" --source "$SOURCE" --limit "$LIMIT"
      - name: Commit photos
        if: always()
        run: |
          git add photos out/*/photo-review.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new photos."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AI photos for review"
          # Another Action may have pushed to main meanwhile: rebase on it (our changes win) and retry.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "::error::Could not push to main after 3 tries. Run this Action again."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.business }}-photo-review
          path: out/${{ inputs.business }}/photo-review.csv
          if-no-files-found: warn
